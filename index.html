<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiador de colores</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>Hola, mundo!</h1>
        <p id="mensaje" role="status"> Pulsa un boton para cambiar el color de fondo</p>

        <button id="lavanda" data-color="lavender">Lavanda</button>
        <button id="rosa" data-color="pink">Rosa</button>
        <button id="verde" data-color="green">Verde</button>
        <button id="azul" data-color="blue">Azul</button>
    </main>
</body>

</html>
